<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture pricing</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 48px; background: #fafafa; }
      .hero h1 { font-size: 32px; margin: 0 0 8px; }
      .plans { display: flex; gap: 16px; margin-top: 32px; }
      .plan { padding: 24px; border: 1px solid #ddd; border-radius: 12px; background: #fff; width: 220px; }
      .cta { padding: 10px 16px; border: 0; border-radius: 8px; background: #222; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Simple pricing</h1>
        <p class="lede">One plan for every team.</p>
      </section>
      <div class="plans">
        <article class="plan"><h2>Starter</h2><p>$0</p><button class="cta" data-testid="starter-cta">Start free</button></article>
        <article class="plan"><h2>Team</h2><p>$29</p><button class="cta">Choose Team</button></article>
      </div>
      <p>Button clicks: <output id="clicks">0</output></p>
    </main>
    <script>
      for (const button of document.querySelectorAll('.cta')) {
        button.addEventListener('click', () => {
          const out = document.getElementById('clicks')
          out.textContent = String(Number(out.textContent) + 1)
        })
      }
    </script>
  </body>
</html>
